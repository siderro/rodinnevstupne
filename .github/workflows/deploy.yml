name: Deploy na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Vlastní doména rodinnevstupne.cz (custom domain v Pages) → web běží v kořeni.
          # Pro <user>.github.io/<repo>/ by bylo: /${{ github.event.repository.name }}/
          VITE_BASE: /
          # Kanonická doména pro canonical, og:url a sitemap (prázdné = https://rodinnevstupne.cz)
          SITE_URL: ${{ vars.SITE_URL }}
          # Supabase je volitelný (jen pro /admin); bez něj web čte statická data ze src/data/venues.json.
          # Nastav v repo: Settings → Secrets and variables → Actions → Variables
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
